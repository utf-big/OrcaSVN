name: Tauri Build

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "lts/*"
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Validate version and prepare draft
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/validate-release.cjs
          test -f "docs/releases/$RELEASE_TAG.md"
      - name: Create or reuse release draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::error::This release is already published. Use a new tag for another release."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false --notes-file "docs/releases/$RELEASE_TAG.md" --title "OrcaSVN $RELEASE_TAG"
          fi
          # A newly created draft can take a moment to appear in the REST list.
          release_id=""
          for attempt in 1 2 3 4 5; do
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
            if [[ "$release_id" =~ ^[0-9]+$ ]]; then break; fi
            sleep 2
          done
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a unique numeric release ID."
            exit 1
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Test and build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf subversion
      - name: Install SVN on Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --no-progress -y --package-parameters="/InstallDir=C:\Tools\SlikSvn"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $svnBin = 'C:\Tools\SlikSvn\bin'
          foreach ($tool in @('svn.exe', 'svnadmin.exe')) {
            $executable = Join-Path $svnBin $tool
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "SVN installation is missing $executable"
            }
            & $executable --version --quiet
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $svnBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install SVN on macOS
        if: matrix.platform == 'macos-latest'
        run: brew install subversion
      - run: npm ci
      - name: Generate app icons
        run: npm run icons
      - name: Verify SVN test tools
        run: |
          svn --version --quiet
          svnadmin --version --quiet
      - name: Build and run regression checks
        run: npm run check
      - name: Give Windows a numeric installer version
        if: matrix.platform == 'windows-latest'
        shell: bash
        # MSI stores the version in four 16-bit fields, so build metadata above
        # 65535 (our 20261026) cannot be represented and bundling fails outright.
        # The installer therefore carries the three-part version while the app
        # keeps showing the full one from package.json.
        run: |
          node -e "
            const fs = require('fs');
            const file = 'src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            config.version = config.version.split('+')[0];
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          "
          node -p "'Windows installer version: ' + require('./src-tauri/tauri.conf.json').version"

      - name: Build and upload installers to draft
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          # Stable versions support both Windows NSIS and MSI installers.
          args: ""

  publish:
    name: Publish complete release
    needs: [prepare, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish after all platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
